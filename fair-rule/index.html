<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exactly ₹500 · ठीक ₹500 | ModuMath</title>
<style>
:root{color-scheme:light;font:17px/1.5 system-ui,sans-serif;color:#193036;background:#f6f2e6}
*{box-sizing:border-box}body{max-width:43rem;margin:auto;padding:1rem}
header,nav,.actions{display:flex;align-items:center;justify-content:space-between;gap:.65rem;flex-wrap:wrap}
h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.1;margin:.65em 0 .2em}h2{font-size:1.25rem}
section,details{background:#fffdf7;border:1px solid #b9beb3;border-radius:.55rem;padding:1rem;margin:1rem 0}
label{display:block;font-weight:650}select,button{font:inherit;padding:.45rem .7rem;border:1px solid #53736b;border-radius:.3rem;background:#fffdf7;color:#183e35}
button,summary{cursor:pointer}.actions{justify-content:flex-start}.actions button:first-child{background:#245747;color:white}
.rule{display:block;margin:.7rem 0;padding:.7rem;background:#e8efe8;font-size:1.1rem}p{margin:.65em 0}
table{width:100%;border-collapse:collapse;text-align:center;font-size:.95rem}th,td{border:1px solid #b6c2ba;padding:.25rem}th{background:#f1f1e5}.yes{background:#dceddd}.no{background:#f7e7de}
a{color:#00594e}footer{font-size:.9rem}button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #c0581c;outline-offset:2px}
</style>
<header><strong>ModuMath</strong><select id="lang" aria-label="Language · भाषा"><option value="en">English</option><option value="hi">हिन्दी</option></select></header>
<main>
<h1 id="title"></h1><p id="intro"></p>
<section><label id="ruleLabel" for="rule"></label><select id="rule"><option value="inclusive"></option><option value="strict"></option></select>
<strong class="rule" id="formula"></strong><label for="example" id="sampleLabel"></label><select id="example"></select>
<p id="question"></p><div class="actions"><button id="predictYes"></button><button id="predictNo"></button></div>
<p id="verdict" aria-live="polite"></p></section>
<details id="map"><summary id="mapTitle"></summary><p id="mapText"></p><table id="matrix"></table><p id="count"></p></details>
</main><footer><p id="sourceText"></p><nav><a id="source" href="https://github.com/Yojana-Saathi/Yojana-Saathi/blob/4b5061d2a547040a76281f9ce8491881630cdfc6/Backend/agents/eligibility_agent.py#L64-L83"></a><a id="practice" href="https://math.hjinlabs.com/?lang=en&amp;utm_source=yojana_fair_rule&amp;utm_medium=learning_activity&amp;utm_campaign=india_math#/?section=practice"></a></nav></footer>
<script>
'use strict';
const $=id=>document.getElementById(id);
const words={
  en:{title:'Exactly ₹500',intro:'A fictional school maths fair offers a booth to teams whose presenter is aged 12 to 16 and whose materials fit the budget. Work with the sample cards below.',ruleLabel:'Choose the budget rule',inclusive:'At most ₹500',strict:'Less than ₹500',sampleLabel:'Choose a team card',age:'Age',cost:'materials',question:'Does this team qualify for a booth?',predictYes:'Yes, both rules pass',predictNo:'No, at least one fails',correct:'Correct.',retry:'Look at the two checks.',met:'passes',miss:'fails',and:'and',mapTitle:'Compare all 21 team cards',mapText:'Each row is a presenter age. Each column is a materials budget. A tick means both rules pass.',count:n=>`${n} of 21 cards qualify. Switch the budget rule to see which column changes.`,sourceText:'We adapted the inclusive bounds and all-checks-must-pass approach from the Indian open-source project YojanaSaathi. All fair rules and team cards here were made for this exercise.',source:'Read the two original checks',practice:'More maths practice on ModuMath',both:'Both checks must pass.'},
  hi:{title:'ठीक ₹500',intro:'एक काल्पनिक स्कूल गणित मेले में स्टॉल उसी टीम को मिलता है जिसके प्रस्तुतकर्ता की उम्र 12 से 16 साल के बीच है और जिसकी सामग्री का खर्च बजट के भीतर है। नीचे दिए गए टीम कार्ड आज़माएँ।',ruleLabel:'बजट का नियम चुनें',inclusive:'अधिकतम ₹500',strict:'₹500 से कम',sampleLabel:'टीम कार्ड चुनें',age:'उम्र',cost:'सामग्री का खर्च',question:'क्या इस टीम को स्टॉल मिलेगा?',predictYes:'हाँ, दोनों शर्तें पूरी हैं',predictNo:'नहीं, कम से कम एक शर्त अधूरी है',correct:'सही।',retry:'दोनों शर्तें फिर देखें।',met:'शर्त पूरी',miss:'शर्त अधूरी',and:'और',mapTitle:'सभी 21 टीम कार्ड की तुलना करें',mapText:'हर पंक्ति प्रस्तुतकर्ता की उम्र है और हर कॉलम सामग्री का खर्च। सही का निशान बताता है कि दोनों शर्तें पूरी हैं।',count:n=>`21 में से ${n} टीमों को स्टॉल मिलेगा। बजट का नियम बदलें और देखें कि कौन-सा कॉलम बदलता है।`,sourceText:'भारत की ओपन-सोर्स परियोजना YojanaSaathi से हमने सीमा पर बराबरी और सभी शर्तें एक साथ जाँचने का तरीका अपनाया। मेले के नियम और टीम कार्ड इस अभ्यास के लिए बनाए गए हैं।',source:'मूल कोड में दोनों जाँचें पढ़ें',practice:'ModuMath पर और गणित का अभ्यास करें',both:'दोनों शर्तें पूरी होनी चाहिए।'}
};
const ages=[11,12,13,14,15,16,17],costs=[499,500,501];
const cards=ages.flatMap(age=>costs.map(cost=>({age,cost})));
let selected=cards.findIndex(c=>c.age===16&&c.cost===500),prediction=null;
function checks(age,cost,strict){return {ageAllowed:12<=age&&age<=16,costAllowed:strict?cost<500:cost<=500};}
function render(){
  const lang=$('lang').value,t=words[lang],strict=$('rule').value==='strict',sign=strict?'<':'≤';
  document.documentElement.lang=lang;
  for(const id of ['title','intro','ruleLabel','sampleLabel','question','predictYes','predictNo','mapTitle','mapText','sourceText','source','practice'])$(id).textContent=t[id];
  $('rule').options[0].textContent=t.inclusive;$('rule').options[1].textContent=t.strict;
  $('formula').textContent=`12 ≤ ${t.age} ≤ 16   ${t.and}   ${t.cost} ${sign} ₹500`;
  $('example').replaceChildren(...cards.map(({age,cost},i)=>new Option(`${t.age} ${age} · ₹${cost}`,String(i))));
  $('example').value=String(selected);
  const {age,cost}=cards[selected],{ageAllowed,costAllowed}=checks(age,cost,strict);
  $('verdict').textContent=prediction===null?'':`${prediction===(ageAllowed&&costAllowed)?t.correct:t.retry} 12 ≤ ${age} ≤ 16: ${ageAllowed?t.met:t.miss}. ₹${cost} ${sign} ₹500: ${costAllowed?t.met:t.miss}. ${t.both}`;
  const table=$('matrix');table.replaceChildren();const header=table.createTHead().insertRow();
  function head(row,label,scope){const th=document.createElement('th');th.scope=scope;th.textContent=label;row.append(th);}
  head(header,t.age,'col');for(const cost of costs)head(header,'₹'+cost,'col');
  let total=0;const body=table.createTBody();
  for(const age of ages){const row=body.insertRow();head(row,String(age),'row');for(const cost of costs){const v=checks(age,cost,strict),ok=v.ageAllowed&&v.costAllowed,cell=row.insertCell();if(ok)total++;cell.textContent=ok?'✓':'×';cell.className=ok?'yes':'no';cell.setAttribute('aria-label',ok?t.met:t.miss);}}
  $('count').textContent=t.count(total);
}
$('lang').value=navigator.language.startsWith('hi')?'hi':'en';
$('lang').onchange=render;
$('rule').onchange=()=>{prediction=null;render();};
$('example').onchange=e=>{selected=Number(e.target.value);prediction=null;render();};
$('predictYes').onclick=()=>{prediction=true;render();};$('predictNo').onclick=()=>{prediction=false;render();};render();
</script></html>
